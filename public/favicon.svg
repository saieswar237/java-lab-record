      .here { fill: #7fb3dc; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="2" />
  <rect class="stone" x="5" y="6" width="22" height="2.5" />
  <rect class="done" x="7" y="10" width="4" height="13" />
  <rect class="here" x="14" y="10" width="4" height="13" />
  <rect class="done" x="21" y="10" width="4" height="13" />
  <rect class="stone" x="4" y="24" width="24" height="2.5" />
</svg>
