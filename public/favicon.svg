<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Java Lab record">
  <style>
    .bg { fill: #e3e6e6; }
    .stone { fill: #545c63; }
    .done { fill: #2f6355; }
    .here { fill: #17527f; }
